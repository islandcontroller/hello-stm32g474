source [find board/st_nucleo_g4.cfg]

# Force link speed to 1000 kHz
adapter speed 1000

# Fix flaky reset
$_TARGETNAME configure -event gdb-attach {
  reset halt
  sleep 100
  halt
}

$_TARGETNAME configure -event reset-start {
  # STM32G4 target script forces 2000 kHz - override it AGAIN...
  adapter speed 1000
}